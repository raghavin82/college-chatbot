<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Syllabus Chatbot</title>

    <link rel="stylesheet" href ="style.css">
</head>

<body>
    <div class = "chat-container">
        <!-- Header -->
        <header class="chat-header">
            <h1>College Syllabus Chatbot</h1>
            <p>IPS Academy • CSE (AIML)</p>
        </header>

        <!-- Chat messages -->
         <main id="chat-box" class = "chat-box">

            <div class="message bot-message">
                <p>
                    Hello 👋<br>
                    Ask me anything about your CSE(AIML) syllabus.
                </p>
            </div>

         </main>

         <!-- Input-area -->
        <div class="input-area">

            <input
                type="text"
                id="question-input"
                placceholder="Ask a syllabus question..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
